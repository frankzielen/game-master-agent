# Baut die Heldenversion und veröffentlicht sie auf GitHub Pages.
# Läuft nur, wenn man ihn von Hand startet (Actions → Heldenversion veröffentlichen → Run workflow).
# Achtung: GitHub Pages ist für jeden mit dem Link lesbar, auch aus einem privaten Repository.
# Vorher einmalig: Settings → Pages → Source: „GitHub Actions“.
name: Heldenversion veröffentlichen

on:
  workflow_dispatch:
    inputs:
      ordner:
        description: "Kampagnenordner (kampagne oder beispiel)"
        required: true
        default: kampagne

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links prüfen
        env:
          ORDNER: ${{ inputs.ordner }}
        run: python3 "$ORDNER/werkzeuge/links-pruefen.py"
      - name: Heldenversion bauen
        env:
          ORDNER: ${{ inputs.ordner }}
        run: python3 "$ORDNER/werkzeuge/kampagne-html-spieler.py" _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
